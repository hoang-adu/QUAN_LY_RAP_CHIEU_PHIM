name: Backend Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Jest unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quan-ly-rap-chieu-phim

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: quan-ly-rap-chieu-phim/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (Jest)
        run: npm run test
